name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit-test Android modules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Test and build Agent
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Test and build Mobile
        run: bash ./gradlew --no-daemon :mobile:testDebugUnitTest :mobile:assembleDebug
